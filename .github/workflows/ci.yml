name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build
        run: swift build --disable-sandbox
      - name: Test
        run: swift test --disable-sandbox
      - name: Package test artifacts
        run: ./Packaging/package-test-app.sh
      - name: Verify test artifacts
        run: ./Packaging/verify-test-artifacts.sh
