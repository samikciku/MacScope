name: Bug report
description: Report a reproducible MacScope problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private file paths, or sensitive process data.
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 15.6, MacBook Pro M3
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Open…\n2. Select…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove usernames, paths, tokens, and other private data first.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed credentials and private data from this report.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true
